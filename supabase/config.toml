# Supabase local development configuration.
# Secrets belong in `supabase/.env.local` (gitignored) or project settings.
project_id = "halal-stock-engine"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/dashboard",
  "http://localhost:8081"
]
jwt_expiry = 3600
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = "http://localhost:54321/auth/v1/callback"

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[edge_runtime]
enabled = true
policy = "per_worker"

# Public webhook: authenticated by Stripe signature, not a Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false

# Cron workers: authenticated by the x-cron-secret header.
[functions.sync-compliance]
verify_jwt = false

[functions.sync-market-data]
verify_jwt = false

[functions.evaluate-alerts]
verify_jwt = false

# User-facing functions: require a Supabase access token.
[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-portal]
verify_jwt = true

[functions.admin-api]
verify_jwt = true

[analytics]
enabled = false
